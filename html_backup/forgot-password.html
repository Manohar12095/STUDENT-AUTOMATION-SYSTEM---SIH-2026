<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — StudentAuth</title>
  <link rel="stylesheet" href="app/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card card animate-in">
      <div class="text-center mb-6">
        <div style="font-size:3rem;margin-bottom:16px;">🔑</div>
        <h1 class="heading-md mb-2">Reset your password</h1>
        <p class="text-muted text-sm">Enter your email and we'll send a reset OTP.</p>
      </div>

      <div id="phase-email">
        <div class="form-group mb-5">
          <label class="form-label required" for="fp-email">Email Address</label>
          <div class="form-input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="fp-email" class="form-input" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter') sendResetOTP()" />
          </div>
        </div>
        <div id="fp-error" class="alert alert-danger mb-4 hidden"></div>
        <button class="btn btn-primary btn-full" id="btn-send-reset" onclick="sendResetOTP()">Send Reset OTP →</button>
        <div class="text-center mt-4">
          <a href="login.html" class="text-muted text-sm" style="text-decoration:none;">← Back to sign in</a>
        </div>
      </div>

      <div id="phase-otp" class="hidden">
        <div class="alert alert-success mb-5">
          <span>✅</span>
          <span>OTP sent to <strong id="fp-email-shown"></strong>. Check your inbox (and the demo toast).</span>
        </div>
        <div class="otp-inputs mb-5" id="fp-otp-inputs">
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
          <input type="text" maxlength="1" class="form-input otp-digit" inputmode="numeric" />
        </div>
        <div id="fp-otp-error" class="alert alert-danger mb-4 hidden"></div>
        <button class="btn btn-primary btn-full" onclick="verifyResetOTP()">Verify OTP →</button>
      </div>

      <div id="phase-new-password" class="hidden">
        <div class="form-group mb-4">
          <label class="form-label required" for="fp-new-pwd">New Password</label>
          <div class="form-input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="fp-new-pwd" class="form-input" placeholder="New password" oninput="updateStrengthMeter(this.value,'fp-str-bar','fp-str-text')" />
            <button type="button" class="input-action" onclick="const f=document.getElementById('fp-new-pwd');f.type=f.type==='password'?'text':'password';this.textContent=f.type==='password'?'👁️':'🙈'">👁️</button>
          </div>
          <div class="strength-meter"><div class="strength-bar" id="fp-str-bar" style="width:0;"></div></div>
          <span class="strength-text" id="fp-str-text"></span>
        </div>
        <div class="form-group mb-5">
          <label class="form-label required" for="fp-confirm-pwd">Confirm Password</label>
          <div class="form-input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="fp-confirm-pwd" class="form-input" placeholder="Confirm new password" />
          </div>
        </div>
        <div id="fp-pwd-error" class="alert alert-danger mb-4 hidden"></div>
        <button class="btn btn-primary btn-full" onclick="resetPassword()">Reset Password →</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app/app.js"></script>
  <script>
    let resetUserId = null;

    // OTP digit behavior
    const digits = [...document.querySelectorAll('.otp-digit')];
    digits.forEach((inp, i) => {
      inp.addEventListener('input', e => {
        inp.value = e.target.value.replace(/\D/g,'').slice(-1);
        if (inp.value && i < digits.length - 1) digits[i+1].focus();
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && i > 0) digits[i-1].focus(); });
      inp.addEventListener('paste', e => {
        e.preventDefault();
        const t = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
        digits.forEach((d,j)=>d.value=t[j]||'');
        digits[Math.min(t.length,digits.length-1)].focus();
      });
    });

    async function sendResetOTP() {
      const email = document.getElementById('fp-email').value.trim();
      const errEl = document.getElementById('fp-error');
      errEl.classList.add('hidden');
      if (!Validators.email(email)) { errEl.textContent='⚠ Enter a valid email.'; errEl.classList.remove('hidden'); return; }
      setButtonLoading('btn-send-reset', true, 'Sending…');
      await new Promise(r => setTimeout(r, 600));

      const user = UserStore.getByEmail(email);
      // Always show success to prevent email enumeration
      resetUserId = user ? user.id : generateId();
      if (user) {
        const otp = await OTPStore.create(resetUserId, 'reset');
        simulateSendOTPEmail(email, otp, 'reset');
      }

      document.getElementById('fp-email-shown').textContent = email;
      document.getElementById('phase-email').classList.add('hidden');
      document.getElementById('phase-otp').classList.remove('hidden');
      digits[0].focus();
    }

    async function verifyResetOTP() {
      const code = digits.map(d=>d.value).join('');
      if (code.length !== 6) { document.getElementById('fp-otp-error').textContent='⚠ Enter all 6 digits.'; document.getElementById('fp-otp-error').classList.remove('hidden'); return; }
      const result = await OTPStore.verify(resetUserId, 'reset', code);
      if (!result.success) { document.getElementById('fp-otp-error').textContent='⚠ ' + result.error; document.getElementById('fp-otp-error').classList.remove('hidden'); return; }
      document.getElementById('phase-otp').classList.add('hidden');
      document.getElementById('phase-new-password').classList.remove('hidden');
    }

    async function resetPassword() {
      const newPwd = document.getElementById('fp-new-pwd').value;
      const confirm = document.getElementById('fp-confirm-pwd').value;
      const errEl = document.getElementById('fp-pwd-error');
      errEl.classList.add('hidden');
      if (newPwd.length < 8) { errEl.textContent='⚠ Password must be at least 8 characters.'; errEl.classList.remove('hidden'); return; }
      if (Validators.passwordStrength(newPwd) < 3) { errEl.textContent='⚠ Password is too weak.'; errEl.classList.remove('hidden'); return; }
      if (newPwd !== confirm) { errEl.textContent='⚠ Passwords do not match.'; errEl.classList.remove('hidden'); return; }
      const hash = await hashPassword(newPwd);
      UserStore.update(resetUserId, { passwordHash: hash, failedLoginAttempts: 0, lockedUntil: null });
      showToast('Password reset!', 'Your password has been updated. Please sign in.', 'success', 5000);
      setTimeout(() => navigate('login.html'), 2000);
    }
  </script>
</body>
</html>
